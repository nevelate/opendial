CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Core USB & Next-Gen Stack Configuration
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y

# Device Identification (Customize as needed)
CONFIG_USB_DEVICE_VID=0xcafe
CONFIG_USB_DEVICE_PID=0xbaea
CONFIG_USB_DEVICE_PRODUCT="OpenDial"
CONFIG_USB_DEVICE_MANUFACTURER="Kizuna dev."

# Logging & Console
CONFIG_LOG=y
CONFIG_USB_DEVICE_LOG_LEVEL_INF=y

CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y

CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_AMS_AS5600=y

CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_CLOCK_CONTROL=y
CONFIG_PIO_RPI_PICO=y
CONFIG_RESET=y
CONFIG_USE_DT_CODE_PARTITION=y
